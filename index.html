<!DOCTYPE html>
<html>
<head>
<title>Firebase Chat Demo</title>
<style>
body{margin:0;font-family:Arial;background:#ece5dd}
#login,#chat{max-width:420px;margin:auto;height:100vh;background:#e5ddd5;padding:10px}
#chat{display:none}
input,button{padding:10px;border-radius:20px;border:none;margin:5px 0}
button{background:#075e54;color:#fff}
#messages{list-style:none;padding:0;height:65vh;overflow-y:auto}
.msg{max-width:70%;margin:6px;padding:8px;border-radius:10px}
.me{background:#dcf8c6;margin-left:auto}
.other{background:#fff}
small{display:block;font-size:11px;color:#555}
</style>
</head>

<body>

<div id="login">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="emailLogin()">Email Login</button>
<button onclick="googleLogin()">Google Login</button>
</div>

<div id="chat">
<button onclick="logout()">Logout</button>
<p id="status">Connecting...</p>
<ul id="messages"></ul>
<input id="msg" placeholder="Message">
<button onclick="send()">Send</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyBNQUWYVUW3SWrCqYA1bkAiHw4B78S4VNo",
 authDomain:"simple-chat-850dd.firebaseapp.com",
 projectId:"simple-chat-850dd",
 appId:"1:823915766458:web:db499423d5f7914af69883"
});

const auth=firebase.auth();
const db=firebase.firestore();
const rdb=firebase.database();
let me="";

// EMAIL LOGIN
function emailLogin(){
 const e=email.value,p=pass.value;
 if(!e||!p){alert("Fill email & password");return;}
 auth.signInWithEmailAndPassword(e,p)
 .then(u=>start(u.user))
 .catch(()=>{
  auth.createUserWithEmailAndPassword(e,p)
  .then(u=>start(u.user))
  .catch(err=>alert(err.message));
 });
}

// GOOGLE LOGIN
function googleLogin(){
 const provider=new firebase.auth.GoogleAuthProvider();
 auth.signInWithPopup(provider)
 .then(u=>start(u.user))
 .catch(e=>alert(e.message));
}

// AFTER LOGIN
function start(user){
 me=user.email;
 login.style.display="none";
 chat.style.display="block";
 setOnline();
 listenMessages();
}

// ONLINE / LAST SEEN (DEMO)
function setOnline(){
 const ref=rdb.ref("status/"+me.replace(".","_"));
 rdb.ref(".info/connected").on("value",s=>{
  if(s.val()){
   ref.onDisconnect().set({state:"offline",last:Date.now()});
   ref.set({state:"online",last:Date.now()});
  }
 });
 rdb.ref("status").on("value",snap=>{
  let online=0;
  snap.forEach(c=>{if(c.val().state=="online")online++;});
  status.innerText =
 online > 1 ? "🟢 Someone is online" : "⚫ Last seen just now";

 });
}

// SEND MESSAGE
function send(){
 if(!msg.value)return;
 db.collection("msgs").add({
  user:me,text:msg.value,status:"sent",time:Date.now()
 }).then(d=>setTimeout(()=>d.update({status:"delivered"}),1000));
 msg.value="";
}

// LISTEN MESSAGE + BLUE TICK
function listenMessages(){
 db.collection("msgs").orderBy("time").onSnapshot(s=>{
  messages.innerHTML="";
  s.forEach(d=>{
   const m=d.data();
   let tick="✔️";
   if(m.status=="delivered")tick="✔️✔️";
   if(m.status=="seen")tick="🔵✔️✔️";
   messages.innerHTML+=`
   <li class="msg ${m.user==me?"me":"other"}">
   ${m.text}<small>${tick}</small></li>`;
  });
  const last=s.docs[s.docs.length-1];
  if(last && last.data().user!=me)
   last.ref.update({status:"seen"});
 });
}

// LOGOUT
function logout(){
 auth.signOut();
 location.reload();
}
</script>
</body>
</html>

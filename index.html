<!DOCTYPE html>
<html>
<head>
  <title>Firebase OTP Chat</title>
  <style>
    body {
      font-family: Arial;
      background:#ece5dd;
      margin: 0;
    }

    #chatBox {
      max-width: 420px;
      height: 100vh;
      margin: auto;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
    }

    #chat {
      list-style: none;
      padding: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .msg {
      max-width: 70%;
      padding: 8px;
      margin: 6px;
      border-radius: 10px;
      clear: both;
    }

    .left { background: white; float: left; }
    .right { background: #dcf8c6; float: right; }

    #msg {
      width: 70%;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      border-radius: 20px;
      border: none;
      background: #075e54;
      color: white;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h3>Mobile Number Login</h3>

  <input id="phone" placeholder="+91XXXXXXXXXX">
  <button onclick="sendOTP()">Send OTP</button>

  <br><br>

  <input id="otp" placeholder="Enter OTP">
  <button onclick="verifyOTP()">Verify OTP</button>

  <div id="recaptcha-container"></div>
</div>

<!-- CHAT -->
<div id="chatBox" style="display:none;">
  <button onclick="logout()">Logout</button>
  <h3>Chat</h3>

  <input id="msg" placeholder="Message">
  <button onclick="send()">Send</button>

  <ul id="chat"></ul>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBNQUWYVUW3SWrCqYA1bkAiHw4B78S4VNo",
    authDomain: "simple-chat-850dd.firebaseapp.com",
    projectId: "simple-chat-850dd",
    storageBucket: "simple-chat-850dd.firebasestorage.app",
    messagingSenderId: "823915766458",
    appId: "1:823915766458:web:db499423d5f7914af69883"
  };

  firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();
  const auth = firebase.auth();

  window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
    'recaptcha-container',
    { size: 'invisible' }
  );

  function sendOTP() {
    const phone = document.getElementById("phone").value;
    if (!phone) return alert("Phone number likho");

    auth.signInWithPhoneNumber(phone, window.recaptchaVerifier)
      .then(result => {
        window.confirmationResult = result;
        alert("OTP sent");
      })
      .catch(err => alert(err.message));
  }

  function verifyOTP() {
    const code = document.getElementById("otp").value;
    if (!code) return alert("OTP likho");

    confirmationResult.confirm(code).then(result => {
      const phone = result.user.phoneNumber;
      localStorage.setItem("chatUser", phone);

      document.getElementById("loginBox").style.display = "none";
      document.getElementById("chatBox").style.display = "flex";
    }).catch(() => alert("Wrong OTP"));
  }

  function send() {
    const user = localStorage.getItem("chatUser");
    const msg = document.getElementById("msg").value;
    if (!msg) return;

    db.collection("messages").add({
      user,
      text: msg,
      time: firebase.firestore.FieldValue.serverTimestamp()
    });

    document.getElementById("msg").value = "";
  }

  db.collection("messages").orderBy("time").onSnapshot(snap => {
    const ul = document.getElementById("chat");
    ul.innerHTML = "";

    snap.forEach(doc => {
      const d = doc.data();
      const side = d.user === localStorage.getItem("chatUser") ? "right" : "left";
      ul.innerHTML += `<li class="msg ${side}">${d.text}</li>`;
    });
  });

  function logout() {
    localStorage.removeItem("chatUser");
    location.reload();
  }
</script>

</body>
</html>

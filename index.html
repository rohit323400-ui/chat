<!DOCTYPE html>
<html>
<head>
  <title>Firebase Chat App</title>
  <style>
    body {
      font-family: Arial;
      background:#ece5dd;
      margin: 0;
    }

    #chatBox {
      max-width: 420px;
      height: 100vh;
      margin: auto;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
    }

    #chat {
      list-style: none;
      padding: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .msg {
      max-width: 70%;
      padding: 8px;
      margin: 6px;
      border-radius: 10px;
      clear: both;
    }

    .left { background: white; float: left; }
    .right { background: #dcf8c6; float: right; }

    #msg {
      width: 70%;
      padding: 10px;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      border-radius: 20px;
      border: none;
      background: #075e54;
      color: white;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginBox">
  <h3>Login</h3>

  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>

  <button onclick="emailLogin()">Login / Signup</button>
  <br><br>

  <button onclick="googleLogin()">Login with Google</button>
</div>


<!-- CHAT -->
<div id="chatBox" style="display:none;">
  <button onclick="logout()">Logout</button>
  <h3>Chat</h3>

  <input id="msg" placeholder="Message">
  <button onclick="send()">Send</button>

  <ul id="chat"></ul>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBNQUWYVUW3SWrCqYA1bkAiHw4B78S4VNo",
  authDomain: "simple-chat-850dd.firebaseapp.com",
  projectId: "simple-chat-850dd",
  storageBucket: "simple-chat-850dd.firebasestorage.app",
  messagingSenderId: "823915766458",
  appId: "1:823915766458:web:db499423d5f7914af69883"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();
const auth = firebase.auth();

/* ---------- EMAIL LOGIN ---------- */
function emailLogin() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Email aur password likho");
    return;
  }

  auth.signInWithEmailAndPassword(email, password)
    .then(res => afterLogin(res.user))
    .catch(err => {
      if (err.code === "auth/user-not-found") {
        auth.createUserWithEmailAndPassword(email, password)
          .then(res => afterLogin(res.user))
          .catch(e => alert(e.message));
      } else {
        alert(err.message);
      }
    });
}

/* ---------- GOOGLE LOGIN ---------- */
function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(res => afterLogin(res.user))
    .catch(err => alert(err.message));
}

/* ---------- AFTER LOGIN ---------- */
function afterLogin(user) {
  const name = user.email;

  localStorage.setItem("chatName", name);

  document.getElementById("loginBox").style.display = "none";
  document.getElementById("chatBox").style.display = "flex";
}

/* ---------- SEND MESSAGE ---------- */
function send() {
  const user = localStorage.getItem("chatName");
  const msg = document.getElementById("msg").value;
  if (!msg) return;

  db.collection("messages").add({
    user,
    text: msg,
    time: firebase.firestore.FieldValue.serverTimestamp()
  });

  document.getElementById("msg").value = "";
}

/* ---------- MESSAGE LISTENER ---------- */
db.collection("messages").orderBy("time").onSnapshot(snap => {
  const ul = document.getElementById("chat");
  ul.innerHTML = "";

  snap.forEach(doc => {
    const d = doc.data();
    const side = d.user === localStorage.getItem("chatName") ? "right" : "left";
    ul.innerHTML += `<li class="msg ${side}">${d.text}</li>`;
  });
});

/* ---------- LOGOUT ---------- */
function logout() {
  auth.signOut();
  localStorage.removeItem("chatName");
  location.reload();
}
</script>
</head>
</body>

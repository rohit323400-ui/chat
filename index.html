<!DOCTYPE html>
<html>
<head>
  <title>Firebase WhatsApp Style Chat</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #ece5dd;
    }

    #loginBox, #chatBox {
      max-width: 420px;
      margin: auto;
      height: 100vh;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
      padding: 10px;
    }

    #chatBox { display: none; }

    input {
      padding: 10px;
      margin: 5px 0;
      border-radius: 20px;
      border: none;
      outline: none;
    }

    button {
      padding: 10px;
      border-radius: 20px;
      border: none;
      background: #075e54;
      color: white;
      margin-top: 5px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0;
    }

    .msg {
      max-width: 70%;
      padding: 8px;
      margin: 6px;
      border-radius: 10px;
      clear: both;
    }

    .left {
      background: white;
      float: left;
    }

    .right {
      background: #dcf8c6;
      float: right;
    }
    
    small {
      display: block !important;
      text-align: right;
      font-size: 11px;
      color: #667781;
      margin-top: 2px;
    }

    .right small {
      text-align: left;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h3>Login</h3>

  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="emailLogin()">Email Login / Signup</button>
  <button onclick="googleLogin()">Google Login</button>
</div>

<!-- CHAT -->
<div id="chatBox">
  <button onclick="logout()">Logout</button>
  <h3>Chat</h3>
  <p id="status">Loading...</p>

  <ul id="chat"></ul>

  <input id="msg" placeholder="Message">
  <button onclick="send()">Send</button>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBNQUWYVUW3SWrCqYA1bkAiHw4B78S4VNo",
  authDomain: "simple-chat-850dd.firebaseapp.com",
  projectId: "simple-chat-850dd",
  storageBucket: "simple-chat-850dd.firebasestorage.app",
  messagingSenderId: "823915766458",
  appId: "1:823915766458:web:db499423d5f7914af69883"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();
const rtdb = firebase.database();

/* ---------- LOGIN ---------- */
function emailLogin() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  auth.signInWithEmailAndPassword(email, password)
    .then(r => afterLogin(r.user))
    .catch(e => {
      auth.createUserWithEmailAndPassword(email, password)
        .then(r => afterLogin(r.user))
        .catch(err => alert("Error: " + err.message));
    });
}

function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider)
    .then(r => afterLogin(r.user))
    .catch(e => alert("Google login failed: " + e.message));
}

/* ---------- AFTER LOGIN ---------- */
function afterLogin(user) {
  localStorage.setItem("me", user.email);
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("chatBox").style.display = "flex";
  presence(user.email);
  listenStatus(user.email);
}

/* ---------- ONLINE / OFFLINE ---------- */
function presence(email) {
  const ref = rtdb.ref("status/" + email.replace(".", "_"));
  rtdb.ref(".info/connected").on("value", snap => {
    if (snap.val() === true) {
      ref.onDisconnect().set({ state: "offline", lastSeen: Date.now() });
      ref.set({ state: "online", lastSeen: Date.now() });
    }
  });
}

function listenStatus(myEmail) {
  rtdb.ref("status").on("value", snap => {
    let onlineCount = 0;
    snap.forEach(childSnap => {
      if (childSnap.val() && childSnap.val().state === "online") onlineCount++;
    });
    status.innerText = onlineCount > 1 ? `🟢 ${onlineCount-1} online` : "⚫ Offline";
  });
}

/* ---------- SEND MESSAGE ---------- */
function send() {
  const text = document.getElementById("msg").value;
  if (!text) return;
  const me = localStorage.getItem("me");
  
  db.collection("messages").add({
    user: me,
    text: text,
    status: "sent",
    time: firebase.firestore.FieldValue.serverTimestamp()
  }).then(docRef => {
    setTimeout(() => {
      docRef.update({ status: "delivered" });
    }, 1000);
  });
  document.getElementById("msg").value = "";
}

/* ---------- MESSAGE LIST ---------- */
db.collection("messages").orderBy("time").onSnapshot(snap => {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";
  const me = localStorage.getItem("me");

  snap.forEach(doc => {
    const d = doc.data();
    const mine = d.user === me;
    
    let tick = "📤";
    if (d.status === "delivered") tick = "✔️✔️"; 
    if (d.status === "seen") tick = "🔵✔️✔️";

    chat.innerHTML += `
      <li class="msg ${mine ? "right" : "left"}">
        ${d.text}
        <small>${tick}</small>
      </li>`;
  });

  // Mark last message as seen
  const lastMsg = snap.docs[snap.docs.length - 1];
  if (lastMsg && lastMsg.data().user !== me && lastMsg.data().status === "delivered") {
    lastMsg.ref.update({ status: "seen" });
  }
});

/* ---------- LOGOUT ---------- */
function logout() {
  auth.signOut();
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>

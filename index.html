<!DOCTYPE html>
<html>
<head>
<title>Firebase Chat Demo</title>
<style>body{
  margin:0;
  font-family:Arial;
  background:#ece5dd;
}

#login,#chat{
  max-width:420px;
  margin:auto;
  height:100vh;
  background:#e5ddd5;
  display:flex;
  flex-direction:column;
}

#chat{display:none}

#topBar{
  background:#075e54;
  color:white;
  padding:12px;
  display:flex;
  justify-content:space-between;
  font-size:15px;
}

#messages{
  flex:1;
  list-style:none;
  padding:10px;
  overflow-y:auto;
}

.msg{
  max-width:70%;
  padding:8px;
  margin:6px;
  border-radius:8px;
  font-size:14px;
}

.me{
  background:#dcf8c6;
  margin-left:auto;
}

.other{
  background:white;
}

small{
  font-size:11px;
  color:#555;
  display:block;
  text-align:right;
}

#inputBar{
  display:flex;
  padding:10px;
  background:#f0f0f0;
}

#inputBar input{
  flex:1;
  padding:10px;
  border-radius:20px;
  border:none;
  outline:none;
}

#inputBar button{
  margin-left:8px;
  border-radius:50%;
  background:#075e54;
  color:white;
  border:none;
  width:40px;
}

</style>
</head>

<body>

<div id="login">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="emailLogin()">Email Login</button>
<button onclick="googleLogin()">Google Login</button>
</div>

<div id="chat">
<div id="topBar">
  <span id="chatName">WhatsApp Chat</span>
  <span id="status">🟢 Online</span>
</div>

<ul id="messages"></ul>
<div id="inputBar">
  <input id="msg" placeholder="Type a message">
  <button onclick="send()">➤</button>
</div>




<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
 apiKey:"AIzaSyBNQUWYVUW3SWrCqYA1bkAiHw4B78S4VNo",
 authDomain:"simple-chat-850dd.firebaseapp.com",
 projectId:"simple-chat-850dd",
 appId:"1:823915766458:web:db499423d5f7914af69883"
});

const auth=firebase.auth();
const db=firebase.firestore();
const rdb=firebase.database();
let me="";

// EMAIL LOGIN
function emailLogin(){
 const e=email.value,p=pass.value;
 if(!e||!p){alert("Fill email & password");return;}
 auth.signInWithEmailAndPassword(e,p)
 .then(u=>start(u.user))
 .catch(()=>{
  auth.createUserWithEmailAndPassword(e,p)
  .then(u=>start(u.user))
  .catch(err=>alert(err.message));
 });
}

// GOOGLE LOGIN
function googleLogin(){
 const provider=new firebase.auth.GoogleAuthProvider();
 auth.signInWithPopup(provider)
 .then(u=>start(u.user))
 .catch(e=>alert(e.message));
}

// AFTER LOGIN
function start(user){
 me=user.email;
 login.style.display="none";
 chat.style.display="block";
 setOnline();
 listenMessages();
}

// ONLINE / LAST SEEN (DEMO)
function setOnline(){
 const ref=rdb.ref("status/"+me.replace(".","_"));
 rdb.ref(".info/connected").on("value",s=>{
  if(s.val()){
   ref.onDisconnect().set({state:"offline",last:Date.now()});
   ref.set({state:"online",last:Date.now()});
  }
 });
 rdb.ref("status").on("value",snap=>{
  let online=0;
  snap.forEach(c=>{if(c.val().state=="online")online++;});
  status.innerText =
 online > 1 ? "🟢 Someone is online" : "⚫ Last seen just now";

 });
}

// SEND MESSAGE
function send(){
 if(!msg.value)return;
 db.collection("msgs").add({
  user:me,text:msg.value,status:"sent",time:Date.now()
 }).then(d=>setTimeout(()=>d.update({status:"delivered"}),1000));
 msg.value="";
}

// LISTEN MESSAGE + BLUE TICK
function listenMessages(){
 db.collection("msgs").orderBy("time").onSnapshot(s=>{
  messages.innerHTML="";
  s.forEach(d=>{
   const m=d.data();
   let tick="✔️";
   if(m.status=="delivered")tick="✔️✔️";
   if(m.status=="seen")tick="🔵✔️✔️";
   messages.innerHTML+=`
   <li class="msg ${m.user==me?"me":"other"}">
   ${m.text}<small>${tick}</small></li>`;
  });
  const last=s.docs[s.docs.length-1];
  if(last && last.data().user!=me)
   last.ref.update({status:"seen"});
 });
}

// LOGOUT
function logout(){
 auth.signOut();
 location.reload();
}
</script>
</body>
</html>
